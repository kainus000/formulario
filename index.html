<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Evento</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="header">
        <div class="titulo">
            <h1>
                <span>Crie e compartilhe</span>
                <span>seu evento.</span>
            </h1>
            <p>
                <span>O primeiro passo, é preencher esse</span>
                <span>formulário de inscrição.</span>
            </p>
        </div>
    </div>


    <div class="formulario">

        <h2>Informações do Evento</h2>
        <hr>

        <label>
            Título do evento
            <span>(mínimo 8 caracteres)</span>
        </label>

        <input type="text">

        <label>
            Link do evento
            <span>(comece com https://)</span>
        </label>

        <input type="text">


        <label>
            Whatsapp para contato
            <span>(somente números)</span>
        </label>

        <input class="vermelho" type="text">

        <label>Informações extras</label>

        <textarea></textarea>


        <label>Categoria</label>

        <select>
            <option>Tipo do evento</option>
            <option>Festa</option>
            <option>Palestra</option>
            <option>Workshop</option>
        </select>


        <h2>Privacidade</h2>

        <hr>

        <label>
            E-mail do administrador
            <span>(digite um email válido)</span>
        </label>

        <input type="text">


        <label>
            Senha de acesso para os participantes
            <span>(mínimo 8 caracteres)</span>
        </label>

        <input type="password">


        <div class="privado">
            <input type="checkbox" id="privado">
            <label for="privado">Evento privado</label>
        </div>

        <h2>Dia e hora</h2>
        <hr>

        <div class="datas">

            <div>
                <label>Data</label>
                <input type="text">
            </div>

            <div>
                <label>Das</label>
                <input type="text" placeholder="19:00">
            </div>

            <div>
                <label>Até</label>
                <input type="text" placeholder="20:00">
            </div>
        </div>
        <button>Salvar evento</button>

    </div>

</body>

</html>
